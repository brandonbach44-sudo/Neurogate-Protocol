name: CI

# Runs the full test suite on every push and pull request. Vercel deploys
# main to the public website on its own, without running these, so this
# is what tells you right away when a push broke something.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build the web app
        run: npm run build

      - name: Regression suites
        run: npm run regression

      - name: Export, CLI and adapter checks
        run: |
          npm run verify:export
          npm run verify:cli
          npm run verify:adapter

      - name: Desktop export check (bundled writer)
        run: |
          npm run desktop:bundle
          npx tsx verify_desktop_export.ts
